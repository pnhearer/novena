[package]
name = "novena"
description = "A Vulkan implementation of a console graphics API, written from scratch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
vulkan = ["dep:ash"]

[dependencies]
ash = { version = "0.38", optional = true, default-features = false, features = ["loaded"] }

[dev-dependencies]
shadowbox = { path = "<local path>" }
