name: Presentation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pixels:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
      VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
    steps:
      - run: apt-get update && apt-get install -y curl build-essential libx11-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers xvfb xauth python3
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check pixels, swapchain resize and frame reuse
        run: xvfb-run -a python3 scripts/check-presentation.py --window
